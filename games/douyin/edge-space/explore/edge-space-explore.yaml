# 探索用例：《边缘空间》（抖音渠道）
# 定位：结构化探索，只走查和记录，不追求严格判红绿；绝不完成真实支付
# 运行：pnpm explore   （即 midscene-test --project explore）
# 说明：
#   1) beforeEach 用 game.enter 固化"进入游戏"前置，保证每项都从主菜单开始（防状态污染）
#   2) 进入关卡用"存在性判断"（能看到某几个菜单文字），不用"完全可见/无加载"这类质量判断
#   3) 每个探索项末尾附带一次 UI 视觉走查（aiQuery），产出可疑点清单供人工复核
#   4) 断言一律为"状态级"（只看当前屏幕能验证的事），不做"过程性断言"
#   5) 重任务之间插入 wait，避免触发模型 TPM 限流
# 每个探索项的前置：进入游戏并回到主菜单（game.enter 按 gameKey 注入探索集上下文）
beforeEach:
  - game.enter:
      gameKey: douyin/edge-space
      profile: explore

cases:
  - name: A-进入与加载
    steps:
      - recordToReport: 探索项A：进入与加载（beforeEach 已完成进入）
      - aiAssert: 屏幕上能看到"新游戏"和"继续游戏"菜单文字，没有崩溃弹窗或黑屏
      # UI 视觉走查（主菜单）
      - aiQuery:
          prompt: |
            检查当前界面的 UI 视觉质量问题，只列出你确实看到的、可描述的问题，没有就返回空数组。
            检查维度：①文字（截断/溢出/重叠/错别字/乱码）②布局（错位/不对齐/间距异常/元素被遮挡）③素材（裂图/占位图/缺失/模糊）④控件状态（异常置灰/按钮不可见/点击区域过小）⑤适配（刘海/圆角/手势区遮挡内容）⑥内容（异常数值/错误文案/大片空白）
            返回格式：[{"type":"文字|布局|素材|控件|适配|内容","description":"具体描述","severity":"高|中|低"}]

  - name: B-主界面入口遍历
    steps:
      - recordToReport: 探索项B：主菜单每个入口逐一点开（不点"退出游戏"）
      - aiAct:
          prompt: |
            依次点开主菜单上的每个入口和底栏图标（新游戏、继续游戏、设置、礼包、购物车、主页、客服等，但绝对不要点"退出游戏"），
            每打开一个就记录界面名称和主要内容，然后关闭或返回；遇到确认弹窗点取消或关闭。全部遍历后回到主菜单。
          $:
            timeout: 300000
      # 状态级断言：只验证"回到主菜单且界面正常"，遍历过程本身由报告记录
      - aiAssert: 屏幕上有"新游戏"和"继续游戏"菜单文字，没有崩溃弹窗或黑屏
      - aiQuery:
          prompt: |
            检查当前界面的 UI 视觉质量问题，只列出你确实看到的、可描述的问题，没有就返回空数组。
            检查维度：①文字（截断/溢出/重叠/错别字/乱码）②布局（错位/不对齐/间距异常/元素被遮挡）③素材（裂图/占位图/缺失/模糊）④控件状态（异常置灰/按钮不可见/点击区域过小）⑤适配（刘海/圆角/手势区遮挡内容）⑥内容（异常数值/错误文案/大片空白）
            返回格式：[{"type":"文字|布局|素材|控件|适配|内容","description":"具体描述","severity":"高|中|低"}]

  - name: C-商城与礼包
    steps:
      - recordToReport: 探索项C：商城/礼包商品清单
      - aiAct:
          prompt: |
            打开礼包/商城界面，停留在商店弹窗内。如果商品列表有商品，记录名称、价格和类型，并逐个点开详情（只查看不购买）；
            如果商品列表为空，记为"空态（可能已购全部商品）"，并记录底部可见的按钮（如"补单""购入"）。
            最后停留在商店界面。不要购买任何东西，不要点"退出游戏"。
          $:
            timeout: 300000
      # 状态级断言：停留在商城界面即可（空态也可能正常）
      - aiAssert: 当前停留在商城或商店弹窗界面（能看到"补单""购入"按钮或商品列表条目）
      - aiQuery:
          prompt: |
            检查当前界面的 UI 视觉质量问题，只列出你确实看到的、可描述的问题，没有就返回空数组。
            检查维度：①文字（截断/溢出/重叠/错别字/乱码）②布局（错位/不对齐/间距异常/元素被遮挡）③素材（裂图/占位图/缺失/模糊）④控件状态（异常置灰/按钮不可见/点击区域过小）⑤适配（刘海/圆角/手势区遮挡内容）⑥内容（异常数值/错误文案/大片空白）
            返回格式：[{"type":"文字|布局|素材|控件|适配|内容","description":"具体描述","severity":"高|中|低"}]
      - aiAct: 关闭商城界面，回到主菜单

  - name: D-支付链路-拉起即取消
    steps:
      # 前置间隔，避免与 C 的高强度调用叠加触发 TPM 限流
      - wait:
          duration: 45
          unit: s
      - recordToReport: 探索项D：支付收银台（只拉起不支付）
      # 第一步：打开商城并点开"尊享免广包"的购买弹窗
      - aiAct:
          prompt: 打开礼包/商城界面，点击"尊享免广包"的购买按钮，直到出现游戏内的购买确认弹窗（上面有价格数字和抖音图标）。不要完成支付。
          $:
            timeout: 240000
      # 第二步：明确点击价格按钮，拉起抖音收银台
      - aiAct:
          prompt: 点击当前弹窗中那个绿色的、显示"120"和抖音图标的按钮（这是调起抖音支付的入口），然后等待抖音支付确认面板出现。不要完成支付。
          $:
            timeout: 180000
      - aiAssert: 当前屏幕是抖音支付确认面板或收银台，能看到支付金额和支付按钮
      - aiQuery:
          prompt: |
            检查当前支付面板的 UI 视觉质量问题，只列出你确实看到的、可描述的问题，没有就返回空数组。
            检查维度：①文字（截断/溢出/重叠/错别字/乱码）②布局（错位/不对齐/间距异常/元素被遮挡）③素材（裂图/占位图/缺失/模糊）④控件状态（异常置灰/按钮不可见/点击区域过小）⑤适配（刘海/圆角/手势区遮挡内容）⑥内容（异常数值/错误文案/大片空白）
            返回格式：[{"type":"文字|布局|素材|控件|适配|内容","description":"具体描述","severity":"高|中|低"}]
      - aiAct: 取消本次支付并关闭支付面板（绝对不要点击确认支付），回到游戏界面
      - aiAssert: 已回到游戏界面，支付面板已关闭

  - name: E-存档持久性
    steps:
      # 前置间隔，重置 TPM 窗口
      - wait:
          duration: 60
          unit: s
      - recordToReport: 探索项E：存档（杀宿主60秒后重进）
      - aiAssert: 屏幕上能看到"继续游戏"菜单文字（存档入口存在）
      - aiAct:
          prompt: 点击"继续游戏"进入游戏进度，做任意一次操作后回到主菜单。不要点"退出游戏"。
          $:
            timeout: 240000
      - runAdbShell: am force-stop com.ss.android.ugc.aweme
      - wait:
          duration: 60
          unit: s
      - game.enter:
          gameKey: douyin/edge-space
          profile: explore
      - aiAssert: 重进后仍能看到"继续游戏"菜单文字（存档入口未丢）
      - aiQuery:
          prompt: |
            检查当前界面的 UI 视觉质量问题，只列出你确实看到的、可描述的问题，没有就返回空数组。
            检查维度：①文字（截断/溢出/重叠/错别字/乱码）②布局（错位/不对齐/间距异常/元素被遮挡）③素材（裂图/占位图/缺失/模糊）④控件状态（异常置灰/按钮不可见/点击区域过小）⑤适配（刘海/圆角/手势区遮挡内容）⑥内容（异常数值/错误文案/大片空白）
            返回格式：[{"type":"文字|布局|素材|控件|适配|内容","description":"具体描述","severity":"高|中|低"}]

  - name: F-基础玩法稳定性走查
    steps:
      # 前置间隔，重置 TPM 窗口
      - wait:
          duration: 60
          unit: s
      - recordToReport: 探索项F：玩法稳定性（有界操作：点3次+滑1次）
      - aiAct:
          prompt: 点击"继续游戏"或"新游戏"进入游戏画面，然后随意点击屏幕3次、向左滑动1次，确认画面有响应。不要点"退出游戏"，不要按 Home 键。
          $:
            timeout: 240000
      - aiAssert: 当前仍在游戏画面内，界面可交互，没有黑屏、卡死、无响应或闪退弹窗
      - aiQuery:
          prompt: |
            检查当前游戏画面的 UI 视觉质量问题，只列出你确实看到的、可描述的问题，没有就返回空数组。
            检查维度：①文字（截断/溢出/重叠/错别字/乱码）②布局（错位/不对齐/间距异常/元素被遮挡）③素材（裂图/占位图/缺失/模糊）④控件状态（异常置灰/按钮不可见/点击区域过小）⑤适配（刘海/圆角/手势区遮挡内容）⑥内容（异常数值/错误文案/大片空白）
            返回格式：[{"type":"文字|布局|素材|控件|适配|内容","description":"具体描述","severity":"高|中|低"}]
      - aiAct: 回到主菜单

  - name: G-断网与恢复
    steps:
      # 前置间隔，重置 TPM 窗口
      - wait:
          duration: 45
          unit: s
      # ⚠️ 仅在 USB 连接 adb 时执行；无线 adb 会被飞行模式切断
      - recordToReport: 探索项G：断网与恢复
      - runAdbShell: cmd connectivity airplane-mode enable
      - wait:
          duration: 3
          unit: s
      - aiAct:
          prompt: 观察当前游戏界面的表现，记录是否出现断网提示、重连提示或卡住，不要做多余操作。
          $:
            timeout: 180000
      - aiQuery:
          prompt: |
            检查当前断网状态的界面表现，只列出你确实看到的、可描述的问题，没有就返回空数组。
            关注：①是否有断网/重连提示 ②提示文案是否完整可读 ③是否有错误弹窗或异常空白 ④界面是否卡死无响应
            返回格式：[{"type":"文字|布局|素材|控件|适配|内容","description":"具体描述","severity":"高|中|低"}]
      - runAdbShell: cmd connectivity airplane-mode disable
      - wait:
          duration: 5
          unit: s
      - aiAct:
          prompt: 等待网络恢复，观察游戏是否恢复正常可交互，记录提示是否消失。
          $:
            timeout: 180000
      - aiAssert: 网络恢复后游戏界面可继续操作，没有卡死

  - name: H-弹窗与权限
    steps:
      - recordToReport: 探索项H：弹窗与权限检查
      - aiAct:
          prompt: 检查当前主菜单是否有公告、活动、更新、权限申请等弹窗；如有，记录弹窗内容并关闭。不要点"退出游戏"。
          $:
            timeout: 180000
      - aiAssert: 当前在主菜单（能看到"新游戏""继续游戏"文字），不存在无法关闭、阻塞主流程的弹窗
      - aiQuery:
          prompt: |
            检查当前界面的 UI 视觉质量问题，只列出你确实看到的、可描述的问题，没有就返回空数组。
            检查维度：①文字（截断/溢出/重叠/错别字/乱码）②布局（错位/不对齐/间距异常/元素被遮挡）③素材（裂图/占位图/缺失/模糊）④控件状态（异常置灰/按钮不可见/点击区域过小）⑤适配（刘海/圆角/手势区遮挡内容）⑥内容（异常数值/错误文案/大片空白）
            返回格式：[{"type":"文字|布局|素材|控件|适配|内容","description":"具体描述","severity":"高|中|低"}]