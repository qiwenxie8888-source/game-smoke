# 冒烟 02：核心功能面——道具 / 存档 / 支付收银台
# 前提：01 已跑通；单独跑本文件时，由 beforeAll 负责进入游戏
beforeAll:
  # 进入游戏（冷启动/深链/点卡片/等主菜单 + AI 上下文）
  - game.enter:
      gameKey: douyin/edge-space

cases:
  - name: 道具-背包界面可正常打开
    steps:
      - aiAct: 打开游戏主界面上的购物车和礼包的界面
      - aiAssert: 购物车/礼包界面已打开，能找到对应的商品列表
      - aiAct: 关闭购物车/礼包界面，回到游戏主界面

  - name: 存档-杀宿主延时重进存档仍在
    steps:
      # 锚点=主菜单"继续游戏"按钮（存档存在的直接证据：进度丢了它就灰/消失）
      - aiAssert: 游戏主菜单上的"继续游戏"按钮存在且可以点击
      - aiAct: 点击"继续游戏"按钮，确认能进入已有存档的游戏进度（等待游戏加载完成）
      # 杀宿主，逼游戏走冷启动读档路径
      - runAdbShell: am force-stop com.ss.android.ugc.aweme
      - wait:
          duration: 60
          unit: s
      # 确定性重进（逻辑封装在 game.enter）
      - game.enter:
          gameKey: douyin/edge-space
      - aiAssert: 重新进入后，主菜单上的"继续游戏"按钮仍然存在且可以点击（存档未丢）

  - name: 支付-收银台可拉起且可取消
    steps:
      # 安全要求：只验证收银台能拉起，绝不完成支付
      - aiAct: 打开游戏主界面上的礼包/商城界面
      - aiAct: 找到"尊享免广包"商品，点击它的购买按钮发起购买，等待支付确认面板弹出
      - aiAssert: 支付确认面板或抖音收银台已弹出，显示支付金额和支付按钮
      - aiAct: 取消本次支付并关闭支付面板（不要点击确认支付），回到游戏界面
      - aiAssert: 已回到游戏界面，支付面板已关闭
